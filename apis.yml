aid: planet-labs
name: Planet Labs
description: 'Planet Labs operates the world''s largest commercial Earth observation
  constellation, imaging the entire landmass of the planet daily with its PlanetScope
  satellites and capturing high-resolution targeted imagery with SkySat and Pelican.
  The Planet Insights Platform is API-first: developers search the archive through
  the Data and Catalog APIs, order processed bundles through the Orders API, set up
  standing area-of-interest deliveries through the Subscriptions API, request tip-and-cue
  collections through the Tasking API, and consume mosaics through the Basemaps and
  Tiles APIs. Analytics, Processing, Statistical, and Batch APIs run server-side workflows
  over the catalog and over Planetary Variables. All APIs sit under api.planet.com,
  authenticate with an API key over HTTP Basic, and are wrapped by the official Planet
  Python SDK.'
